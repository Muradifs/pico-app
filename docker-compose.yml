version: '3.8'

services:
  app:
    container_name: entrance-pico-app
    build: .
    ports:
      - "5173:5173" # Mapiramo port iz kontejnera na tvoje računalo
    volumes:
      - .:/app # Omogućuje da vidiš promjene u kodu odmah (live reload)
      - /app/node_modules # Sprječava brisanje instaliranih paketa unutar kontejnera
    environment:
      - CHOKIDAR_USEPOLLING=true # Osigurava da live reload radi glatko